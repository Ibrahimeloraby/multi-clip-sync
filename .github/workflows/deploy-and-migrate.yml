name: Build and Deploy

on:
  push:
    branches: [main, master, claude/setup-multi-clip-sync-wYozK]
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: dtkfcnlxkshrflujtsaj
  SUPABASE_URL: https://dtkfcnlxkshrflujtsaj.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_1ykGt2WJ2uJqsL_tlAf4Dg_KnJ_NblN

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.SUPABASE_PROJECT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Run database setup
        run: npx tsx scripts/run-migrations.ts
        continue-on-error: true
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_PASSWORD }}

      - name: Build complete
        run: |
          echo "✅ Build completed!"
          echo "📦 Lovable syncs automatically from GitHub."
