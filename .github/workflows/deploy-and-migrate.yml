name: Build and Deploy

on:
  push:
    branches: [main, master, claude/setup-multi-clip-sync-wYozK]
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: vhagqzzodmathyfbgjxr
  SUPABASE_URL: https://vhagqzzodmathyfbgjxr.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoYWdxenpvZG1hdGh5ZmJnanhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0NDI4MzIsImV4cCI6MjA3NjAxODgzMn0.iHQqNiz0MJIjG_4dk7B0Xlrjn0M01QSkxGaIq48HPiA

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.SUPABASE_PROJECT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Full automation: Supabase migrations + Lovable deployment
  automate:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Supabase Migrations via SQL Editor
        run: npx tsx automation/run.ts supabase:migrate
        env:
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        continue-on-error: true

      - name: Sync to Lovable
        run: npx tsx automation/run.ts lovable:deploy
        env:
          LOVABLE_EMAIL: ${{ secrets.LOVABLE_EMAIL }}
          LOVABLE_PASSWORD: ${{ secrets.LOVABLE_PASSWORD }}
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-screenshots
          path: automation/screenshots/
          retention-days: 7

      - name: Automation Status
        run: echo "✅ Supabase migrations and Lovable sync completed!"
