name: Deploy and Run Migrations

on:
  push:
    branches: [main, master, claude/setup-multi-clip-sync-wYozK]
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_ID: vhagqzzodmathyfbgjxr
  SUPABASE_URL: https://vhagqzzodmathyfbgjxr.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoYWdxenpvZG1hdGh5ZmJnanhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0NDI4MzIsImV4cCI6MjA3NjAxODgzMn0.iHQqNiz0MJIjG_4dk7B0Xlrjn0M01QSkxGaIq48HPiA

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run Database Migrations
        run: |
          supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy run-migrations --project-ref ${{ env.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Migration Status
        run: echo "✅ Database migrations completed successfully!"

  build:
    runs-on: ubuntu-latest
    needs: migrate
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ env.SUPABASE_PROJECT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Auto-create secrets reminder (runs if secrets are missing)
  check-secrets:
    runs-on: ubuntu-latest
    if: failure()
    needs: migrate
    steps:
      - name: Secrets Missing Notice
        run: |
          echo "❌ Migration failed - likely missing GitHub Secrets"
          echo ""
          echo "Please add these 2 secrets to your repository:"
          echo "  Settings → Secrets and variables → Actions → New repository secret"
          echo ""
          echo "Required secrets (only 2 needed!):"
          echo "  1. SUPABASE_ACCESS_TOKEN - Get from https://supabase.com/dashboard/account/tokens"
          echo "  2. SUPABASE_DB_PASSWORD - Get from Project Settings → Database → Database password"
          echo ""
          echo "Or visit /setup in your deployed app for a one-click alternative!"
          exit 1
